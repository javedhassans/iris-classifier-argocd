[project]
name = "smlapp-argocd-test"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.104.1",
    "uvicorn==0.24.0",
    "scikit-learn==1.3.2",
    "numpy==1.24.3",
    "pydantic==2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-cov==4.1.0",
    "black==23.11.0",
    "ruff==0.1.8",
]

[build-system]
requires=["setuptools>=68.0", "wheel"]
build-backend="setuptools.build_meta"

[tool.setuptools]
packages = ["src"]


